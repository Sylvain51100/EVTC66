<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nos services – Express VTC 66</title>
  <meta name="description" content="Express VTC 66 – Page services épurée." />
  <link rel="icon" href="/favicon.ico" />
  <meta name="robots" content="index, follow" />

  <style>
    :root {
      /* LÉGÈREMENT moins vert que la home pour signaler le changement de page */
      --bg:#154a3d;       /* home = #0f3d33 */
      --text:#efe7d5;
      --muted:rgba(255,255,255,.12);
      --btn-green:#146b54;
      --price:#ff6a00;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height:1.5;
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    .container { max-width: 900px; margin-inline:auto; padding-inline:16px; }

    header { text-align:center; padding:28px 0 6px; }
    header img { height:96px; width:auto; border-radius:14px; box-shadow:0 0 10px rgba(0,0,0,.3); object-fit:cover; }
    h1 { margin:8px 0 0; font-size:28px; font-weight:800; letter-spacing:.2px; }

    /* Bouton retour en bas */
    .footer-bar {
      margin-top:auto;              /* pousse le footer en bas */
      position:sticky;
      bottom:0;
      background: rgba(0,0,0,.18);
      backdrop-filter: blur(6px);
      border-top:1px solid var(--muted);
    }
    .inner { display:flex; justify-content:center; padding:16px; }

    .btn-back {
      display:inline-block;
      padding:12px 18px;
      border-radius:14px;
      font-weight:800;
      text-decoration:none;
      background: var(--btn-green);
      border: 2px solid var(--price);
      color: var(--text);
      transition: all .25s ease;
      box-shadow:0 0 0 rgba(255,106,0,0);
    }
    .btn-back:hover { box-shadow:0 0 10px rgba(255,106,0,.6); transform: translateY(-1px); filter: brightness(1.06); }
    .btn-back:active { transform: translateY(1px); filter: brightness(.96); }

    /* Accessibilité */
    .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <a class="sr-only" href="#retour">Aller au bouton de retour</a>

  <header class="container" role="banner">
    <img src="/LOGO EVTC66.jpg" alt="Logo Express VTC 66" loading="eager" />
    <h1>Express VTC 66</h1>
    <!-- Page minimaliste : aucun autre bouton ni contenu -->
  </header>

  <!-- Main volontairement vide -->
  <main class="container" role="main" aria-label="Page services épurée"></main>

  <!-- Bouton de retour en bas uniquement -->
  <footer class="footer-bar" role="contentinfo">
    <div class="inner">
      <a id="retour" class="btn-back" href="/">← Retour à l'accueil</a>
    </div>
  </footer>
</body>
</html>
